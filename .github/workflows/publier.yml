name: Publier l’application

on:
  push:
    branches:
      - main
      - claude/pregnancy-tracking-app-yd2jbx
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # enablement active Pages via l'API : évite d'avoir à le faire à la main
      # dans les réglages du dépôt. Nécessite que le plan le permette — Pages
      # sur dépôt privé demande un compte GitHub Pro.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      # Tant que la source Pages du dépôt est « Deploy from a branch », GitHub
      # lance en parallèle son propre déploiement, qui publie la racine du dépôt
      # — donc la page de développement, vide. Le dernier déploiement arrivé
      # gagne : on laisse donc l'autre finir avant de publier le vrai build.
      - name: Laisser finir le déploiement de branche
        env:
          JETON: ${{ github.token }}
          DEPOT: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request

          url = (
              f"https://api.github.com/repos/{os.environ['DEPOT']}/actions/runs"
              f"?head_sha={os.environ['SHA']}&per_page=50"
          )
          entetes = {
              'Authorization': f"Bearer {os.environ['JETON']}",
              'Accept': 'application/vnd.github+json',
          }

          def en_cours():
              requete = urllib.request.Request(url, headers=entetes)
              with urllib.request.urlopen(requete, timeout=20) as reponse:
                  runs = json.load(reponse)['workflow_runs']
              return [
                  r for r in runs
                  if r['name'] == 'pages build and deployment'
                  and r['status'] != 'completed'
              ]

          for tentative in range(30):
              try:
                  restants = en_cours()
              except Exception as erreur:
                  print('Interrogation impossible, on publie sans attendre :', erreur)
                  break
              if not restants:
                  print('Aucun déploiement de branche en cours.')
                  break
              print(f"{len(restants)} déploiement(s) de branche en cours, attente…")
              time.sleep(10)
          else:
              print('Délai dépassé : on publie quand même.')
          PY

      - id: deploiement
        uses: actions/deploy-pages@v4
